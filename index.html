<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Blog</title>
        <style>
            header{
                background-color: darkcyan;
                color: aliceblue;
                text-align: center;

            }
            main{
                background-color: aliceblue;

            }
            img{

                height: 80px;

        </style>
    </head>
    <body>
        <header>

               tecnologia e programação</p>
        </header>
        <main>
            <img src="ai dentro.jpeg" alt="ai dentu">
            <div>
                <h2>Meu primeiro post</h2>
                <p class="artigo-autor">Por: Pedro meta 287</p>
                <p>Boas-vindas ao meu novo blog! Aqui 
                   vou compartilhar dicas de programação
                   e curiosidades da área de tecnologia.</p>
                   <button>curtidada<span>0</span></button>
            </div>
        </main>
</body>
<script>
    const botao = document.querySelector("button");
    botao.addEventListener("click", botaoClicado);
    
    function botaoClicado() {
let texto = botao.querySelector("span");
texto.textContent++;
}
</script>
</html>
